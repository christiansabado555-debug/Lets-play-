<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Vault - Hub</title>
    <style>
        /* =========================================
           GLOBAL STYLES & VARIABLES
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-deep: #060913;     /* Darkest Background */
            --bg-card: #111827;     /* Dark Card Background */
            --border-muted: #374151; /* Default Borders */
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            
            /* Main Accent Color (Action Red) */
            --accent-glow: #ef4444; 
            --accent-glow-alpha: rgba(239, 68, 68, 0.6);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* =========================================
           HEADER (TOP NAV)
           ========================================= */
        header {
            background-color: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(10px);
            position: fixed; /* Keep on top */
            top: 0; left: 0; width: 100%; z-index: 1000;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-muted);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-glow);
        }

        /* SEARCH INPUT (HEADER RIGHT) */
        .search-container {
            position: relative;
            width: 300px;
        }

        .search-container input {
            width: 100%;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            background-color: var(--bg-deep);
            border: 1px solid var(--border-muted);
            border-radius: 4px;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        .search-container input:focus {
            outline: none;
            border-color: var(--accent-glow);
        }

        /* Search icon (placeholder emoji for code simplicity) */
        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* =========================================
           HERO SECTION (BANNER WITH IMAGE)
           ========================================= */
        .hero {
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.4), var(--bg-deep)),
                url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=2000&auto=format&fit=crop'); /* Dynamic Space background */
            background-size: cover;
            background-position: center 20%;
            height: 300px;
            display: flex;
            align-items: flex-end; /* Text at bottom of banner */
            padding: 0 4rem 2rem;
            margin-top: 60px; /* Offset for fixed header */
        }

        .hero-text {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .hero h1 span {
            color: var(--accent-glow);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* =========================================
           MAIN CONTENT AREA
           ========================================= */
        .main-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 4rem;
            flex-grow: 1;
        }

        /* CATEGORY SELECTOR */
        .categories {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 1rem;
        }

        .category-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            transition: color 0.2s;
        }

        .category-btn:hover {
            color: var(--text-main);
        }

        .category-btn.active {
            color: var(--accent-glow);
            font-weight: bold;
        }

        /* =========================================
           GAME GRID (NOW LIST VIEW STYLING)
           ========================================= */
        .game-grid {
            display: flex;
            flex-direction: column; /* Stack vertically for list view */
            gap: 1.2rem;
        }

        /* CATCHY GAME CARD (LIST ITEM STYLE) */
        .game-card {
            background-color: var(--bg-card);
            border-radius: 6px;
            border: 1px solid var(--border-muted);
            overflow: hidden;
            display: flex; /* Key change: thumbnail and info are horizontal */
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
        }

        /* HOVER EFFECTS - ACTIVE BORDER AND GLOW */
        .game-card:hover {
            background-color: #171f30;
            box-shadow: 0 0 15px var(--accent-glow-alpha);
            transform: translateY(-2px);
            border-color: var(--accent-glow); /* Red Border on hover */
        }

        /* THUMBNAIL AREA */
        .card-thumbnail {
            width: 180px; /* Reduced width for list format */
            min-width: 180px;
            height: 100px; /* Reduced height for list format */
            background-color: #1a2233;
            border-right: 1px solid var(--border-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .placeholder-icon {
            font-size: 2.5rem;
        }

        /* CONTENT AREA (RIGHT OF THUMBNAIL) */
        .card-content {
            flex-grow: 1;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between; /* Separate text and action button */
            align-items: center;
            gap: 1.5rem;
        }

        .card-info {
            max-width: 70%;
        }

        .card-title {
            font-size: 1.25rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 0.1rem;
            letter-spacing: 0.5px;
        }

        .card-description {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
            line-height: 1.3;
        }

        /* CATCHY TAGS */
        .card-tag {
            font-size: 0.7rem;
            color: #ef4444; /* Brighter red text */
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid #ef4444; /* Red border */
            padding: 0.1rem 0.5rem;
            border-radius: 3px;
        }

        /* CATCHY PLAY BUTTON */
        .play-btn {
            background-color: #ef4444; /* Bold Red */
            color: #fff;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .play-btn:hover {
            background-color: #dc2626; /* Darker red on hover */
        }

        /* EMPTY STATE / NO FOUND */
        .empty-state {
            text-align: center;
            padding: 4rem;
            border: 2px dashed var(--border-muted);
            border-radius: 6px;
            color: var(--text-muted);
        }

        /* =========================================
           MODAL PLAYER (POPUP)
           ========================================= */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center; align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-card);
            width: 90%; max-width: 1200px; height: 90vh;
            border-radius: 8px; border: 1px solid var(--accent-glow);
            box-shadow: 0 0 30px var(--accent-glow-alpha);
            overflow: hidden; display: flex; flex-direction: column;
        }

        .modal-header {
            padding: 0.8rem 1rem;
            background-color: #0d111b;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-muted);
        }

        .modal-header h3 {
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-btn {
            background: none; border: none; color: #fff;
            font-size: 1.8rem; cursor: pointer;
        }

        .modal-body {
            flex-grow: 1; background: #000;
        }

        .modal-body iframe {
            width: 100%; height: 100%; border: none;
        }

        /* =========================================
           FOOTER
           ========================================= */
        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: rgba(17, 24, 39, 0.6);
            border-top: 1px solid var(--border-muted);
            color: var(--text-muted);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <a href="#" class="logo">🎮 <span>My Game Vault</span></a>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search my games...">
        </div>
    </header>

    <!-- HERO / BANNER SECTION -->
    <section class="hero">
        <div class="hero-text">
            <h1>My personal <span>vault</span></h1>
            <p>A central hub for my creations. Select an item below to begin.</p>
        </div>
    </section>

    <!-- MAIN HUB AREA -->
    <main class="main-container">
        <!-- CATEGORY FILTERS -->
        <div class="categories" id="categoryContainer">
            <button class="category-btn active" data-category="all">All Content</button>
            <button class="category-btn" data-category="action">Action</button>
            <button class="category-btn" data-category="simulation">Simulation</button>
        </div>

        <!-- GAME LIST CONTAINER -->
        <div class="game-grid" id="gameGrid">
            <!-- Game items are dynamically added here via JS -->
        </div>
    </main>

    <!-- POPUP PLAYER (MODAL) -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Loading Content...</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <iframe id="gameFrame" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>Copyright © 2026 My Game Vault</p>
    </footer>

    <!-- JAVASCRIPT LOGIC (No changes needed here!) -->
    <script>
        // --- YOUR GAMES LIST (Keep this as is) ---
        const games = [
            {
                id: "fire-vs-ice",
                title: "Fire vs Ice",
                category: "action",
                icon: "🔥❄️",
                description: "An epic battle between the elemental forces of Fire and Ice!",
                thumbnail: "", // Path to image if you have one
                gameUrl: "game.html"
            },
            {
                id: "3d-food-truck",
                title: "3D Food Truck Burger Simulator",
                category: "simulation",
                icon: "🍔🚚",
                description: "Run your own 3D food truck and serve hungry customers!",
                thumbnail: "", // Path to image if you have one
                gameUrl: "burger_king.html"
            }
        ];

        // --- DOM ELEMENTS ---
        const gameGrid = document.getElementById('gameGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryContainer = document.getElementById('categoryContainer');
        const gameModal = document.getElementById('gameModal');
        const gameFrame = document.getElementById('gameFrame');
        const modalTitle = document.getElementById('modalTitle');
        const closeModal = document.getElementById('closeModal');

        let currentCategory = 'all';

        // --- RENDER GAMES ---
        function renderGames(gameList) {
            gameGrid.innerHTML = '';

            if (gameList.length === 0) {
                gameGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>NO RESULTS</h3>
                        <p>No content matches your selection.</p>
                    </div>
                `;
                return;
            }

            gameList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = (e) => {
                    // Prevent modal opening if the actual play button was clicked (it will handle it)
                    if (e.target.className !== 'play-btn') {
                        openGame(game);
                    }
                };

                const thumbnailContent = game.thumbnail 
                    ? `<img src="${game.thumbnail}" alt="${game.title}">`
                    : `<span class="placeholder-icon">${game.icon || '🎯'}</span>`;

                card.innerHTML = `
                    <div class="card-thumbnail">
                        ${thumbnailContent}
                    </div>
                    <div class="card-content">
                        <div class="card-info">
                            <span class="card-tag">${game.category}</span>
                            <h3 class="card-title">${game.title}</h3>
                            <p class="card-description">${game.description}</p>
                        </div>
                        <button class="play-btn" onclick="openGame(${JSON.stringify(game).replace(/"/g, '&quot;')})">PLAY</button>
                    </div>
                `;
                gameGrid.appendChild(card);
            });
        }

        // --- OPEN & CLOSE MODAL ---
        function openGame(game) {
            modalTitle.textContent = game.title;
            gameFrame.src = game.gameUrl;
            gameModal.classList.add('active');
        }

        closeModal.onclick = () => {
            gameModal.classList.remove('active');
            gameFrame.src = ''; // Clear iframe to stop game audio/logic
        };

        window.onclick = (e) => {
            if (e.target === gameModal) {
                closeModal.click();
            }
        };

        // --- SEARCH & FILTER LOGIC ---
        function filterGames() {
            const searchTerm = searchInput.value.toLowerCase();
            const filtered = games.filter(game => {
                const matchesSearch = game.title.toLowerCase().includes(searchTerm) || 
                                      game.description.toLowerCase().includes(searchTerm);
                const matchesCategory = currentCategory === 'all' || game.category.toLowerCase() === currentCategory.toLowerCase();
                return matchesSearch && matchesCategory;
            });
            renderGames(filtered);
        }

        searchInput.addEventListener('input', filterGames);

        categoryContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('category-btn')) {
                document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.getAttribute('data-category');
                filterGames();
            }
        });

        // Initial Load
        renderGames(games);
    </script>
</body>
</html>
